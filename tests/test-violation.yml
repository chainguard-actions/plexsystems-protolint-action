name: Test lint violation fails the action
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a proto with a lowercase service name
        run: |
          mkdir -p "$GITHUB_WORKSPACE/lint-violation"
          cat > "$GITHUB_WORKSPACE/lint-violation/bad.proto" <<'EOF'
          syntax = "proto3";

          package bad;

          service my_bad_service {}
          EOF
          cat "$GITHUB_WORKSPACE/lint-violation/bad.proto"
      - id: action
        uses: .
        continue-on-error: true
        with:
          configDirectory: test
      - name: Assert lint failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected the action to fail on a lint violation"
            exit 1
          fi
          echo "PASS"
