name: Test invalid proto fails lint
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create invalid proto (service name not UpperCamelCase)
        run: |
          rm -rf "$GITHUB_WORKSPACE/tmp-protolint-invalid"
          mkdir -p "$GITHUB_WORKSPACE/tmp-protolint-invalid"
          cat > "$GITHUB_WORKSPACE/tmp-protolint-invalid/bad.proto" <<'EOF'
          syntax = "proto3";

          package bad;

          service my_bad_service {}
          EOF
          cat "$GITHUB_WORKSPACE/tmp-protolint-invalid/bad.proto"
      - id: action
        uses: .
        continue-on-error: true
        with:
          configDirectory: tests/fixtures/valid
          srcDirectory: tmp-protolint-invalid
      - name: Cleanup
        if: always()
        run: rm -rf "$GITHUB_WORKSPACE/tmp-protolint-invalid"
      - name: Assert lint failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected lint failure for non-UpperCamelCase service name"
            exit 1
          fi
          echo "PASS"
