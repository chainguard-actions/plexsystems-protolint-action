name: Test custom config rule violation fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a proto with a lowercase message name
        run: |
          mkdir -p "$GITHUB_WORKSPACE/lint-violation"
          cat > "$GITHUB_WORKSPACE/lint-violation/bad_message.proto" <<'EOF'
          syntax = "proto3";

          package badmessage;

          message bad_message {}
          EOF
      - id: action
        uses: .
        continue-on-error: true
        with:
          configDirectory: tests/fixtures/strict-config
      - name: Assert lint failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for MESSAGE_NAMES_UPPER_CAMEL_CASE violation"
            exit 1
          fi
          echo "PASS"
